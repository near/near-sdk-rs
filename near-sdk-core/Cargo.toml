[package]
name = "near-sdk-core"
version = "4.4.2"
authors = ["Near Inc <hello@near.org>"]
edition.workspace = true
license.workspace = true
readme = "README.md"

categories.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = """
Core Rust types from the NEAR SDK, extracted for use without the full SDK.
"""

[dependencies]
serde = { workspace = true, default-features = true, features = ["derive"], optional = true }
serde_json = { workspace = true, features = ["preserve_order"], optional = true }
serde_with = { workspace = true, features = [
    "base64",
    "hex",
    "json",
], optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }
base64 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
bs58 = { workspace = true }

arbitrary = { workspace = true, features = ["derive"], optional = true }

near-account-id = { workspace = true }
near-gas = { workspace = true }
near-token = { workspace = true }
near-crypto-hash = { workspace = true }
near-sdk-env = { workspace = true, optional = true }

schemars-v0_8 = { workspace = true, optional = true }
near-primitives-core = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
near-parameters = { workspace = true, optional = true }

# near-crypto is only used by the `near-crypto-interop` conversions, which are host-only (gated
# `cfg(all(not(target_arch = "wasm32"), feature = "near-crypto-interop"))`). Keep it off wasm targets
# so contracts that enable `unit-testing` still build for wasm — since nearcore 2.13, near-crypto
# pulls a non-optional aws-lc-rs (C) dependency that cannot compile for wasm32. Mirrors near-sdk.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
near-crypto = { workspace = true, optional = true }

[target.'cfg(near)'.dependencies]
near-sdk-env = { workspace = true }

# `PublicKeyHandle` hashes ML-DSA-65 keys with SHA3-256. On-chain that is the `sha3_256` host
# function via `near-sdk-env`; off-chain it is pure Rust, like `near-global-contracts` does for
# its own derivation.
[target.'cfg(not(near))'.dependencies]
sha3 = { workspace = true }

[dev-dependencies]
# XXX: `near-sdk` was added in order to enable tests and doctests compiling with mockchain
near-sdk = { workspace = true, features = ["unit-testing"] }

[lints]
workspace = true

[features]
default = []

serde = [
    "dep:serde",
    "dep:serde_json",
    "dep:serde_with",
    "dep:base64",
    "dep:hex",
    "near-account-id/serde",
    "near-gas/serde",
    "near-token/serde",
]
borsh = [
    "dep:borsh",
    "near-account-id/borsh",
    "near-gas/borsh",
    "near-token/borsh",
]

schemars-v0_8 = [
    "dep:schemars-v0_8",
    "near-account-id/schemars-v0_8",
    "near-gas/schemars-v0_8",
]

abi = [
    "borsh",
    "schemars-v0_8",
    "borsh/unstable__schema",
    "near-account-id/abi",
    "near-gas/abi",
    "serde_with/schemars_0_8",
]

arbitrary = ["dep:arbitrary", "near-account-id/arbitrary"]

unstable = []

near-primitives-interop = ["dep:near-primitives-core"]
near-crypto-interop = ["dep:near-crypto", "dep:unicode-segmentation"]

__near-sdk-unit-testing = [
    "serde",
    "borsh",
    "near-primitives-interop",
    "near-crypto-interop",
    "near-sdk-env/__near-sdk-unit-testing",
    "dep:unicode-segmentation",
    "dep:near-parameters",
    "dep:near-sdk-env",
]
