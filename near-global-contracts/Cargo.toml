[package]
name = "near-global-contracts"
version = "0.3.3"
edition.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "./README.md"
description = """
Global contract identifiers and account derivation for deterministic (NEP-616, `0s`) and universal (NEP-655, `0u`) accounts for the NEAR SDK.
"""

# Make `derive_account_id` visible on docs.rs (it requires `borsh`; the off-chain sha3
# backend is pulled in unconditionally on the `cfg(not(near))` path). Including all of
# serde/borsh/abi here surfaces the full type surface.
[package.metadata.docs.rs]
features = ["serde", "borsh", "abi", "near-primitives-interop"]

[dependencies]
# `internal_unstable` is for `AccountId::new_unvalidated` in the `0s` derivation.
near-account-id = { workspace = true, features = ["internal_unstable"] }
near-crypto-hash = { workspace = true }
# SHA3-256 for the `0u` id: the `sha3_256` host function on `cfg(near)`, pure Rust otherwise.
near-digest = { workspace = true, features = [
    "sha3",
] }
# `UniversalStateInitV1::access_keys` is a set of `near_sdk_core::types::PublicKeyHandle`,
# which lives next to `PublicKey` in near-sdk-core.
near-sdk-core = { workspace = true }

hex = { workspace = true, optional = true }

cfg_eval = { version = "0.1", optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_with = { version = "3.20", features = [
    "base58",
    "base64",
    "hex",
], optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }

arbitrary = { workspace = true, features = ["derive"], optional = true }

near-sdk-env = { workspace = true, optional = true }
near-primitives-core = { workspace = true, optional = true }

schemars-v0_8 = { workspace = true, optional = true }

[target.'cfg(near)'.dependencies]
near-sdk-env = { workspace = true }

[target.'cfg(not(near))'.dependencies]
digest-io = { version = "0.1" }
sha3 = { workspace = true }

[dev-dependencies]
# XXX: `near-sdk` was added in order to enable testing and doctests
near-sdk = { workspace = true, features = ["unit-testing"] }
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true

[features]
default = []

serde = [
    "dep:cfg_eval",
    "dep:serde",
    "dep:serde_with",
    "near-account-id/serde",
    "near-sdk-core/serde",
]

borsh = ["dep:borsh", "dep:hex", "near-account-id/borsh", "near-sdk-core/borsh"]

# A JSON schema describes the serde form, and the base64 adapters (`serde_as`) that shape it only
# exist with `serde`, so this (and `abi`) turns `serde` on.
schemars-v0_8 = [
    "serde",
    "dep:schemars-v0_8",
    "near-account-id/schemars-v0_8",
    "serde_with/schemars_0_8",
    "near-sdk-core/schemars-v0_8",
]

abi = [
    "schemars-v0_8",
    "borsh",
    "borsh/unstable__schema",
    "near-account-id/abi",
    "near-sdk-core/abi",
]

arbitrary = ["dep:arbitrary", "near-account-id/arbitrary"]

near-primitives-interop = ["dep:near-primitives-core"]

__near-sdk-unit-testing = [
    "dep:near-sdk-env",
    "dep:hex",
    "serde",
    "borsh",
    "near-primitives-interop",
    "near-sdk-env/__near-sdk-unit-testing",
    "near-sdk-core/__near-sdk-unit-testing",
]
