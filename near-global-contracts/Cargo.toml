[package]
name = "near-global-contracts"
version = "0.2.6"
edition.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version = "1.88"
readme = "./README.md"
description = """
Global contract identifiers and account derivation for deterministic (NEP-616, `0s`) and universal (NEP-655, `0u`) accounts for the NEAR SDK.
"""

# Make `derive_account_id` visible on docs.rs (it requires `borsh`; the off-chain sha3
# backend is pulled in unconditionally on the `cfg(not(near))` path). Including all of
# serde/borsh/abi here surfaces the full type surface.
[package.metadata.docs.rs]
features = ["serde", "borsh", "abi", "near-primitives-interop"]

[dependencies]
# `encode_universal_account_id`, the `0u` encoder `derive_universal_account_id` uses, is new in
# 3.2 (patched from git until published; the requirement becomes "3.2" when the patch is dropped).
# `internal_unstable` is for `AccountId::new_unvalidated` in the `0s` derivation.
near-account-id = { version = "3.1", features = ["internal_unstable"] }
near-crypto-hash = { path = "../near-crypto-hash/", version = "~0.2.0" }
# SHA3-256 for the `0u` id: the `sha3_256` host function on `cfg(near)`, pure Rust otherwise.
near-digest = { path = "../near-digest/", version = "0.1.2", features = ["sha3"] }
# `UniversalStateInitV1::access_keys` is a set of `near_sdk_core::types::PublicKeyHandle`,
# which lives next to `PublicKey` in near-sdk-core.
near-sdk-core = { path = "../near-sdk-core/", version = "~4.2.3" }

hex = { version = "0.4", optional = true }

cfg_eval = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_with = { version = "3.20", features = ["base58", "base64", "hex"], optional = true }
borsh = { version = "1.0.0", features = ["derive"], optional = true }

arbitrary = { version = "1.4", features = ["derive"], optional = true }

near-sdk-env = { path = "../near-sdk-env/", version = "~0.1.6", optional = true }
# Pinned to the published nearcore 2.14 release candidate `0.38.0-rc.2`; see near-sdk/Cargo.toml
# for the rationale. Bump to `0.38.0` (drop the `=`) once 2.14 ships stable.
near-primitives-core = { version = "=0.38.0-rc.2", optional = true }

schemars-v0_8 = { version = "0.8.22", optional = true, package = "schemars" }

[target.'cfg(near)'.dependencies]
near-sdk-env = { path = "../near-sdk-env/", version = "~0.1.6" }

[target.'cfg(not(near))'.dependencies]
digest-io = { version = "0.1" }
sha3 = { version = "0.11" }

[dev-dependencies]
# XXX: `near-sdk` was added in order to enable testing and doctests
near-sdk = { path = "../near-sdk", features = ["unit-testing"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[features]
default = []

serde = [
    "dep:cfg_eval",
    "dep:serde",
    "dep:serde_with",
    "near-account-id/serde",
    "near-sdk-core/serde",
]

borsh = [
    "dep:borsh",
    "dep:hex",
    "near-account-id/borsh",
    "near-sdk-core/borsh",
]

schemars-v0_8 = [
    "dep:schemars-v0_8",
    "near-account-id/schemars-v0_8",
    "serde_with/schemars_0_8",
    "near-sdk-core/schemars-v0_8",
]

abi = [
    "schemars-v0_8",
    "borsh",
    "borsh/unstable__schema",
    "near-account-id/abi",
    "near-sdk-core/abi",
]

arbitrary = [
    "dep:arbitrary",
    "near-account-id/arbitrary",
]

near-primitives-interop = ["dep:near-primitives-core"]

__near-sdk-unit-testing = [
    "dep:near-sdk-env",
    "dep:hex",
    "serde",
    "borsh",
    "near-primitives-interop",
    "near-sdk-env/__near-sdk-unit-testing",
    "near-sdk-core/__near-sdk-unit-testing",
]
