# Storage v2 upgrade/migration search on nearcore's runtime (near-contract-sim's explore API).
# Run with CARGO_TARGET_DIR pointed at the simulator's target/ so nearcore is not rebuilt; see
# ../README.md for the exact commands.
[package]
name = "proto-sim-upgrade-sim"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
near-contract-sim = { path = "/Users/ricky/Developer/near-contract-sim-scenario" }
proptest = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same as the simulator's own Cargo.toml, so its nearcore build is reused.
[profile.dev.package."*"]
debug = false

[workspace]
