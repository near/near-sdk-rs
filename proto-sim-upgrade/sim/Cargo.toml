# Storage v2 upgrade/migration search on nearcore's runtime (near-contract-sim's explore API).
# Run with CARGO_TARGET_DIR pointed at the simulator's target/ so nearcore is not rebuilt; see
# ../README.md for the exact commands.
[package]
name = "proto-sim-upgrade-sim"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
# near-contract-sim main @ 8e8642db ("One crate: primitives replaces main (#83)"), checked out as a
# worktree next to near-sdk-rs: `git -C ~/Developer/near-contract-sim-scenario worktree add
# ~/Developer/near-contract-sim-main 8e8642db`. Relative, so it resolves from any checkout at
# ~/Developer/near-sdk-rs (a .claude/worktrees checkout needs a symlink; see ../README.md).
near-contract-sim = { path = "../../../near-contract-sim-main" }
proptest = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# quickstart.md (sim main): optimise dependencies (nearcore) in the test profile; unoptimised
# nearcore can take a minute for one large call. The simulator's own Cargo.toml sets only
# `debug = false`, so the first build here compiles nearcore at opt-level 2 once into the shared
# target dir; both harness crates then reuse it.
[profile.dev.package."*"]
opt-level = 2
debug = false

[workspace]
