# Measures the storage v2 prototype's gas on the real NEAR runtime with near-contract-sim.
# Run with CARGO_TARGET_DIR pointed at the simulator's target/ so nearcore is not rebuilt;
# see GAS_MEASUREMENTS.md at the worktree root.
[package]
name = "proto-gas-sim"
version = "0.0.0"
edition = "2024"
publish = false

[dev-dependencies]
near-contract-sim = { path = "/Users/ricky/Developer/near-contract-sim-scenario" }
borsh = "1"
serde_json = "1"

# Same as the simulator's own Cargo.toml, so its nearcore build is reused.
[profile.dev.package."*"]
debug = false

[workspace]
