[workspace]
resolver = "3"
members = [
    "near-sdk",
    "near-sdk-core",
    "near-sdk-env",
    "near-sdk-macros",
    "near-contract-standards",
    "near-sys",
    "near-global-contracts",
    "near-crypto-hash",
    "near-digest",
]
exclude = ["examples/"]

[workspace.package]
version = "5.30.2"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["wasm"]
repository = "https://github.com/near/near-sdk-rs"
homepage = "https://docs.near.org/"
rust-version = "1.95"

[workspace.dependencies]
# Members inherit these with `{ workspace = true }` and add their own features and `optional`.
# An entry that sets `default-features = false` lets members opt back in with
# `default-features = true`; the reverse does not work.
anyhow = "1.0"
arbitrary = "1.4"
base64 = "0.22"
borsh = "1.0.0"
bs58 = "0.5"
cfg_eval = "0.1"
darling = { version = "0.20.3", default-features = false }
derive_arbitrary = "1.2.3"
digest = "0.11.3"
digest-io = "0.1"
ed25519-dalek = "2.2.0"
getrandom = "0.2"
hex = "0.4"
hex-literal = "1.1.0"
impl-tools = "0.12.0"
Inflector = { version = "0.11.4", default-features = false }
insta = "1.39.0"
near-abi = "0.4.0"
near-account-id = "3"
near-crypto = { version = "0.38.0", default-features = false }
near-crypto-hash = { path = "near-crypto-hash", version = "~0.2.0" }
near-digest = { path = "near-digest", version = "0.1.5" }
near-gas = "0.3"
near-global-contracts = { path = "near-global-contracts", version = "~0.3.4" }
near-parameters = "0.38.0"
near-primitives = "0.38.0"
near-primitives-core = "0.38.0"
near-rng = "0.1.1"
# For dev-dependencies only: this path-only entry has no `version`, so using it
# from a published crate's `[dependencies]` would fail at `cargo publish` time.
near-sdk = { path = "near-sdk" }
near-sdk-core = { path = "near-sdk-core", version = "~4.4.3" }
near-sdk-env = { path = "near-sdk-env", version = "~0.1.9" }
near-sdk-macros = { path = "near-sdk-macros", version = "~5.30.2" }
near-sys = { path = "near-sys", version = "~0.4.1" }
near-token = "0.3"
near-vm-runner = { version = "0.38.0", default-features = false }
near-workspaces = "0.24.0"
object = { version = "0.40", default-features = false }
once_cell = { version = "1.17", default-features = false }
openssl = "0.10"
p256 = { version = "0.14.0", default-features = false }
prettyplease = "0.2.15"
proc-macro2 = { version = "1", default-features = false }
quickcheck = "1.0"
quote = { version = "1.0", default-features = false }
rand = "0.8.4"
rand_chacha = "0.3.1"
rand_xorshift = "0.3"
ripemd = "0.2.0"
rstest = "0.26.1"
rustversion = "1.0"
schemars = "0.8.22"
schemars-v0_8 = { package = "schemars", version = "0.8.22" }
schemars-v1 = { package = "schemars", version = "1.0.3" }
serde = { version = "1", default-features = false }
serde_json = "1"
serde_with = "3.20"
sha2 = "0.11"
sha3 = "0.11"
strum = "0.26"
strum_macros = "0.26"
syn = { version = "2", default-features = false }
tokio = "1"
trybuild = "1.0"
unicode-segmentation = "1"
wasmparser = { version = "0.243", default-features = false }
wee_alloc = { version = "0.4.5", default-features = false }
zeroize = "1.9.0"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
