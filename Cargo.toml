[workspace]
resolver = "3"
members = [
    "near-sdk",
    "near-sdk-core",
    "near-sdk-env",
    "near-sdk-macros",
    "near-contract-standards",
    "near-sys",
    "near-global-contracts",
    "near-crypto-hash",
    "near-digest",
]
exclude = ["examples/"]

[workspace.package]
version = "5.30.1"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["wasm"]
repository = "https://github.com/near/near-sdk-rs"
homepage = "https://docs.near.org/"
rust-version = "1.95"

[workspace.dependencies]
arbitrary = "1.4"
base64 = "0.22"
borsh = "1.0.0"
bs58 = "0.5"
hex = "0.4"
hex-literal = "1.1.0"
near-abi = "0.4.0"
near-account-id = "3"
near-crypto = { version = "0.38.0", default-features = false }
near-crypto-hash = { path = "near-crypto-hash", version = "~0.2.0" }
near-digest = { path = "near-digest", version = "0.1.5" }
near-gas = "0.3"
near-global-contracts = { path = "near-global-contracts", version = "~0.3.3" }
near-parameters = "0.38.0"
near-primitives = "0.38.0"
near-primitives-core = "0.38.0"
# For dev-dependencies only: this path-only entry has no `version`, so using it
# from a published crate's `[dependencies]` would fail at `cargo publish` time.
near-sdk = { path = "near-sdk" }
near-sdk-core = { path = "near-sdk-core", version = "~4.4.2" }
near-sdk-env = { path = "near-sdk-env", version = "~0.1.9" }
near-sys = { path = "near-sys", version = "~0.4.1" }
near-token = "0.3"
near-vm-runner = { version = "0.38.0", default-features = false }
ripemd = "0.2.0"
schemars = "0.8.22"
schemars-v0_8 = { package = "schemars", version = "0.8.22" }
serde = { version = "1", default-features = false }
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
sha3 = "0.11"
unicode-segmentation = "1"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
