[workspace]
resolver = "3"
members = [
    "near-sdk",
    "near-sdk-core",
    "near-sdk-env",
    "near-sdk-macros",
    "near-contract-standards",
    "near-sys",
    "near-global-contracts",
    "near-crypto-hash",
    "near-digest",
]
exclude = ["examples/"]

[workspace.package]
version = "5.29.1"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["wasm"]
repository = "https://github.com/near/near-sdk-rs"
homepage = "https://docs.near.org/"
rust-version = "1.93"

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']

# Temporary: near-account-id 3.2 (`encode_universal_account_id`) is not on crates.io yet.
# Drop this section once near-account-id 3.2.0 is published.
[patch.crates-io]
near-account-id = { git = "https://github.com/near/near-account-id-rs", rev = "3d662dd2c04916afb86bbb052ea76e34394717dc" }
