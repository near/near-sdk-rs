# Storage v2 search contract: one root covering every v2 shape the reference model drives
# (root scalar, Map of records owning a Map + Vector + Lazy, LookupMap, Set), driven by
# ../sim/tests/storage_v2_search.rs on near-contract-sim. Built by ../build.sh.
[package]
name = "proto-sim-search-contract"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { path = "../../near-sdk", features = ["unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
