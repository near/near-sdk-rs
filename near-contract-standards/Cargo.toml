[package]
name = "near-contract-standards"
version.workspace = true
authors = ["Near Inc <hello@near.org>"]
edition.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/near-contract-standards"
description = """
NEAR smart contracts standard library.
"""

[dependencies]
# Not inherited: the workspace `near-sdk` entry is path-only (dev-dependencies only), and
# `default-features = false` cannot be applied to an inherited entry that keeps defaults.
near-sdk = { path = "../near-sdk", version = "~5.30.3", default-features = false, features = [
    "legacy",
] }

[dev-dependencies]
near-sdk = { path = "../near-sdk", default-features = false, features = [
    "unit-testing",
] }

[features]
default = []
abi = ["near-sdk/__abi-generate"]

[package.metadata.docs.rs]
features = ["abi"]

[lints]
workspace = true
