[package]
name = "near-sdk"
version.workspace = true
authors = ["Near Inc <max@nearprotocol.com>"]
edition.workspace = true
license.workspace = true
readme = "README.md"
categories.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = """
Rust library for writing NEAR smart contracts.
"""

[[test]]
name = "compilation_tests"
path = "compilation_tests/all.rs"
required-features = ["abi", "unstable"]

[dependencies]
# Provide near_bidgen macros.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_with = { workspace = true, features = ["base64", "hex", "json"] }
near-sdk-macros = { path = "../near-sdk-macros", version = "~5.30.1" }
near-sys = { path = "../near-sys", version = "0.4.1" }
near-sdk-env = { workspace = true }
near-sdk-core = { workspace = true, features = [
    "serde",
    "borsh",
] }
near-global-contracts = { path = "../near-global-contracts/", version = "~0.3.3", features = [
    "serde",
    "borsh",
] }
base64 = { workspace = true }
borsh = { workspace = true, features = ["derive"] }
bs58 = { workspace = true }
hex = { workspace = true, optional = true }
hex-literal = { workspace = true }

# Used for caching, might be worth porting only functionality needed.
once_cell = { version = "1.17", default-features = false }

near-account-id = { workspace = true, features = ["serde", "borsh"] }
near-gas = { workspace = true, features = ["serde", "borsh"] }
near-token = { workspace = true, features = ["serde", "borsh"] }

arbitrary = { workspace = true, features = ["derive"], optional = true }

near-digest = { workspace = true, features = [
    "sha2",
    "sha3",
    "ripemd",
], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wee_alloc = { version = "0.4.5", default-features = false, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
schemars = { workspace = true, optional = true }
ed25519-dalek = { version = "2.2.0", optional = true }
p256 = { version = "0.14.0", default-features = false, features = [
    "ecdsa",
    "std",
], optional = true }
near-abi = { workspace = true, features = [
    "__chunked-entries",
], optional = true }
# nearcore 2.14 (protocols 87 and 88).
near-primitives = { workspace = true, optional = true }
near-primitives-core = { workspace = true, optional = true }
near-vm-runner = { workspace = true, optional = true }
near-crypto = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
near-parameters = { workspace = true, optional = true }

[dev-dependencies]
openssl = { version = "0.10", features = ["vendored"] }
near-sdk = { workspace = true, features = ["legacy", "unit-testing"] }
rand = { version = "0.8.4", features = ["small_rng"] }
trybuild = "1.0"
rustversion = "1.0"
rand_xorshift = "0.3"
quickcheck = "1.0"
arbitrary = { version = "1.2.3", features = ["derive"] }
derive_arbitrary = "1.2.3"
hex = { version = "0.4.3", features = ["serde"] }
getrandom = { version = "0.2", features = ["js"] }
rand_chacha = "0.3.1"
near-rng = "0.1.1"
near-abi = { workspace = true, features = ["__chunked-entries"] }
object = { version = "0.40", default-features = false, features = ["read", "std"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
strum = "0.25.0"
strum_macros = "0.25.3"
insta = "1.39.0"
wasmparser = { version = "0.243", default-features = false, features = ["std"] }

[lints]
workspace = true

[features]
default = ["wee_alloc"]

arbitrary = [
    "dep:arbitrary",
    "near-account-id/arbitrary",
    "near-sdk-core/arbitrary",
    "near-global-contracts/arbitrary",
]
expensive-debug = []
deterministic-account-ids = ["dep:hex", "near-sys/deterministic-account-ids"]
# Universal (`0u`) accounts (NEP-655). Requires nearcore protocol version 88+: every
# `Promise` links `promise_batch_action_universal_state_init` when enabled, and a contract
# importing it cannot be deployed before then.
universal-accounts = ["near-sys/universal-accounts"]
digest = ["dep:near-digest"]
unstable = ["near-sdk-core/unstable"]
legacy = []
global-contracts = []
abi = [
    "borsh/unstable__schema",
    "near-abi",
    "schemars",
    "near-sdk-macros/abi",
    "near-account-id/abi",
    "near-gas/abi",
    "near-token/abi",
    "near-sdk-core/abi",
    "near-global-contracts/abi",
    "serde_with/schemars_0_8",
]
unit-testing = [
    "near-vm-runner",
    "near-primitives-core",
    "near-primitives",
    "near-crypto",
    "unicode-segmentation",
    "near-parameters",
    "near-sdk-env/__near-sdk-unit-testing",
    "near-sdk-core/__near-sdk-unit-testing",
    "near-global-contracts/__near-sdk-unit-testing",
]
non-contract-usage = [
    "ed25519-dalek",
    "p256",
    "near-crypto",
    "unicode-segmentation",
    "near-primitives-core",
    "near-sdk-core/near-crypto-interop",
    "near-sdk-core/near-primitives-interop",
    "near-global-contracts/near-primitives-interop",
]

__abi-embed = ["near-sdk-macros/__abi-embed"]
__abi-generate = ["abi", "near-sdk-macros/__abi-generate"]

__macro-docs = []

[package.metadata.near]
# Minimum nearcore protocol version this release of near-sdk targets.
# Read by cargo-near to determine the maximum rustc version allowed when
# building contracts that depend on this near-sdk. PV 84 (nearcore 2.12)
# unlocks bulk-memory + reftypes opcodes, enabling rustc 1.93+. PV 85 is what
# the gas-key actions linked by every `Promise` require. The `universal-accounts`
# feature raises the floor to 88.
min_protocol_version = 85

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
