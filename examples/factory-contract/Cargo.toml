[package]
name = "factory-contract-wrapper"
version = "0.1.0"
authors = ["Near Inc <hello@nearprotocol.com>"]
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/near/near-sdk-rs"

[dev-dependencies]
anyhow = "1.0"
test-case = "2.0"
tokio = { version = "1.14", features = ["full"] }
near-sdk = { path = "../../near-sdk", features = ["unit-testing"] }
near-workspaces = { version = "0.22", features = ["unstable"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"

[workspace]
resolver = "3"
members = ["high-level", "low-level"]

# Temporary: near-account-id 3.2 (`encode_universal_account_id`) is not on crates.io yet.
# Drop this section once near-account-id 3.2.0 is published.
[patch.crates-io]
near-account-id = { git = "https://github.com/near/near-account-id-rs", rev = "3d662dd2c04916afb86bbb052ea76e34394717dc" }
