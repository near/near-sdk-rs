[package]
name = "factory-contract-wrapper"
version = "0.1.0"
authors = ["Near Inc <hello@nearprotocol.com>"]
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/near/near-sdk-rs"

[dev-dependencies]
anyhow = "1.0"
test-case = "3"
tokio = { version = "1", features = ["full"] }
cargo-near-build = "0.11.5"
near-kit = "0.30.0-rc.7"
near-sandbox = "0.4.1"

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"

[workspace]
resolver = "3"
members = ["high-level", "low-level"]
