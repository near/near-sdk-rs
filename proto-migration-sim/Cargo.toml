# Storage v2 migration round: deploys the v1 fungible-token wasm, populates it, deploys the v2
# wasm over it, calls `migrate`, and measures transfers on nearcore's runtime via
# near-contract-sim. Own workspace; shares near-contract-sim's target dir to reuse nearcore:
#   CARGO_TARGET_DIR=~/Developer/near-contract-sim-scenario/target cargo +1.95.0 test --test ft_upgrade -- --nocapture --include-ignored
[package]
name = "proto-migration-sim"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]

[dev-dependencies]
near-contract-sim = { path = "../../../../../near-contract-sim-scenario" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
debug = false

[workspace]
