[package]
name = "near-sdk-env"
version = "0.1.9"
authors = ["Near Inc <hello@near.org>"]
edition.workspace = true
license.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "./README.md"
description = """
Low-level abstraction over `near-sys` host functions. Provides the same
hashing (and related) API on wasm32 (via NEAR VM host calls) and on 
non-wasm32 (via pure-Rust crates).
"""

[dependencies]
near-sys = { workspace = true, optional = true }

[target.'cfg(near)'.dependencies]
near-sys = { workspace = true }

[target.'cfg(not(near))'.dependencies]
ripemd = { version = "0.1.1" }
sha2 = { workspace = true }
sha3 = { workspace = true }

[dev-dependencies]
# XXX: `near-sdk` was added in order to enable testing and doctests
near-sdk = { workspace = true, features = ["unit-testing"] }
hex = { workspace = true }

[lints]
workspace = true

[features]
__near-sdk-unit-testing = ["dep:near-sys"]
